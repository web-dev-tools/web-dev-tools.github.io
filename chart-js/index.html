<!DOCTYPE html>
<html>

<head>
  <!-- General Info -->
  <title>Generate Charts with Chart.js | Web Dev Tools</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex">

  <!-- Styles -->
  <link href='../style.css' rel="stylesheet">
  <link href='./style-chart.css' rel="stylesheet">

  <!-- ChartJS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
  <header>
    <h1>Chart.js Generator</h1>
    <div class="divider"></div>
  </header>
  <main>

    <section id="parser-input">
      <h4>Input</h4>
      <textarea id="input">https://web-dev-tools.github.io/</textarea>
      <div class="divider" style="grid-row:span 2"></div>
      <h4>Controls</h4>
      <button class="btn" onclick="updateChart()">Parse URL</button>
      <button class="btn" onclick="changeChartType('bar')">Share</button>
      <div class="form-group">
        <label class="form-switch">
          <input type="checkbox" name="json" checked="true">
          <i class="form-icon"></i> Convert to JSON
        </label>
      </div>
    </section>

    <section id="parser-output">
      <h4>Chart</h4>
      <canvas id="chart"></canvas>
    </section>

    <section id="options">

    </section>

  </main>
  <footer>
    <div class="divider"></div>
    <p>Updated 2026.01.19<br>
      Created with ❤️ by A. Dean Kelly</p>
    <script src="chart-generator.js"></script>
  </footer>
</body>

</html>
