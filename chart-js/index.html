<!DOCTYPE html>
<html>

<head>
  <!-- General Info -->
  <title>Generate Charts with Chart.js | Web Dev Tools</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex">

  <!-- Styles -->
  <link href='./style.css' rel="stylesheet">
  <link href='./style-chart.css' rel="stylesheet">

  <!-- ChartJS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
  <header>
    <h1>Chart.js Generator</h1>
    <div class="divider"></div>
  </header>
  <main>

    <section id="section-chart-input">
      <div class="form-group">
        <h4>Input</h4>
        <input id="chart-csv-upload" type="file" accept="csv"></input>

        <label class="form-switch">
          <input class="data-options" data-variable="headerRow" type="checkbox">
          <icon class="form-icon"></icon>
          Use First Row as Headers
        </label>

        <label class="form-switch">
          <input class="data-options" data-variable="labelColumn" type="checkbox">
          <icon class="form-icon"></icon>
          Use First Column as Labels
        </label>

        <label class="form-switch">
          <input class="data-options" data-variable="multiDatasets" type="checkbox">
          <icon class="form-icon"></icon>
          Use Each Column as Dataset
        </label>

        <label class="form-switch">
          <input class="data-options" data-variable="headerKeys" type="checkbox">
          <icon class="form-icon"></icon>
          Use the First Row as Keys (Bubble Chart)
        </label>

      </div>

      <!-- CHART CONTROLS -->
      <div class="form-group">
        <h4>Controls</h4>
        <label for="select-change-chart-type">Select a Chart Type</label>
        <select id="select-change-chart-type">
          <option value="bar">Bar Chart</option>
          <option value="line">Line Chart</option>
          <option value="bubble">Bubble Chart</option>
          <option value="pie">Pie Chart</option>
          <option value="doughnut">Doughnut Chart</option>
        </select>

        <!-- AXIS OPTIONS -->
        <!-- X-AXIS OPTIONS -->
        <details open>
          <summary>X-Axis Options</summary>
          <div class="form-group grid-col-3">
            <label class="form-switch grid-col-3-span">
              <input class="form-switch" data-variable="options.scales.x.display" type="checkbox" checked>
              <i class="form-icon"></i>Enable X-Axis
            </label>
            <label class="form-label">X-Axis Type
              <label class="form-radio">
                <input class="form-switch" name="x-axis-type" data-variable="options.scales.x.type" type="radio"
                  value="linear">
                <i class="form-icon"></i> Linear
              </label>
              <label class="form-radio">
                <input class="form-switch" name="x-axis-type" data-variable="options.scales.x.type" type="radio"
                  value="category" checked>
                <i class="form-icon"></i> Category
              </label>
              <label class="form-radio">
                <input class="form-switch" name="x-axis-type" data-variable="options.scales.x.type" type="radio"
                  value="logarithmic">
                <i class="form-icon"></i> Logarithmic
              </label>
            </label>
            <label class="form-label">X-Axis Scale
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.x.beginAtZero" type="checkbox">
                <i class="form-icon"></i>Zero Start
              </label>
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.x.offset" type="checkbox" checked>
                <i class="form-icon"></i>X-Offset
              </label>
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.x.grid.offset" type="checkbox" checked>
                <i class="form-icon"></i>Grid Offset
              </label>
            </label>

            <!-- X-AXIS POSITION -->
            <label class="form-label">X-Axis Position
              <label class="form-radio">
                <input class="form-switch" name="x-axis-position" data-variable="options.scales.x.position" type="radio"
                  value="top">
                <i class="form-icon"></i> Top
              </label>
              <label class="form-radio">
                <input class="form-switch" name="x-axis-position" data-variable="options.scales.x.position" type="radio"
                  value="bottom" checked>
                <i class="form-icon"></i> Bottom
              </label>
              <label class="form-switch grid-col-3-span">
                <input class="form-switch" data-variable="options.scales.x.reverse" type="checkbox">
                <i class="form-icon"></i>Reverse X-Axis
              </label>
            </label>
          </div>
        </details>

        <!-- Y-AXIS OPTIONS -->
        <details open>
          <summary>Y-Axis Options</summary>
          <div class="form-group grid-col-3">
            <label class="form-switch grid-col-3-span">
              <input class="form-switch" data-variable="options.scales.y.display" type="checkbox" checked>
              <i class="form-icon"></i>Enable Y-Axis
            </label>

            <label class="form-label">Y-Axis Type
              <label class="form-radio">
                <input class="form-switch" name="y-axis-type" data-variable="options.scales.y.type" type="radio"
                  value="linear" checked>
                <i class="form-icon"></i> Linear
              </label>
              <label class="form-radio">
                <input class="form-switch" name="y-axis-type" data-variable="options.scales.y.type" type="radio"
                  value="category">
                <i class="form-icon"></i> Category
              </label>
              <label class="form-radio">
                <input class="form-switch" name="y-axis-type" data-variable="options.scales.y.type" type="radio"
                  value="logarithmic">
                <i class="form-icon"></i> Logarithmic
              </label>
            </label>
            <!-- Y-AXIS SCALE -->
            <label class="form-label">Y-Axis Scale
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.y.beginAtZero" type="checkbox" checked>
                <i class="form-icon"></i>Zero Start
              </label>
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.y.offset" type="checkbox">
                <i class="form-icon"></i>Y-Offset
              </label>
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.y.grid.offset" type="checkbox">
                <i class="form-icon"></i>Grid Offset
              </label>
            </label>

            <!-- Y-AXIS POSITION -->
            <label class="form-label">Y-Axis Position
              <label class="form-radio">
                <input class="form-switch" name="y-axis-position" data-variable="options.scales.y.position" type="radio"
                  value="left" checked>
                <i class="form-icon"></i> Left
              </label>
              <label class="form-radio">
                <input class="form-switch" name="y-axis-position" data-variable="options.scales.y.position" type="radio"
                  value="right">
                <i class="form-icon"></i> Right
              </label>
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.y.reverse" type="checkbox">
                <i class="form-icon"></i>Reverse Y-Axis
              </label>
            </label>
          </div>
        </details>

        <!-- Y2-AXIS OPTIONS -->
        <details>
          <summary>Second Y-Axis</summary>
          <div class="form-group grid-col-3">
            <label class="form-switch grid-col-3-span">
              <input class="form-switch" data-variable="options.scales.y2.display" type="checkbox">
              <i class="form-icon"></i>Enable Second Y-Axis
            </label>
            <label class="form-label">Y2-Axis Type
              <label class="form-radio">
                <input class="form-switch" name="y2-axis-type" data-variable="options.scales.y2.type" type="radio"
                  value="linear" checked>
                <i class="form-icon"></i> Linear
              </label>
              <label class="form-radio">
                <input class="form-switch" name="y2-axis-type" data-variable="options.scales.y2.type" type="radio"
                  value="category">
                <i class="form-icon"></i> Category
              </label>
            </label>
            <label class="form-label">Y2-Axis Scale
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.y2.beginAtZero" type="checkbox" checked>
                <i class="form-icon"></i>Zero Start
              </label>
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.y2.offset" type="checkbox">
                <i class="form-icon"></i>Y-Offset
              </label>
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.y2.grid.offset" type="checkbox">
                <i class="form-icon"></i>Grid Offset
              </label>
            </label>
            <!-- Y2-AXIS POSITION -->
            <label class="form-label">Y-Axis Position
              <label class="form-radio">
                <input class="form-switch" name="y2-axis-position" data-variable="options.scales.y2.position"
                  type="radio" value="left" checked>
                <i class="form-icon"></i> Left
              </label>
              <label class="form-radio">
                <input class="form-switch" name="y2-axis-position" data-variable="options.scales.y2.position"
                  type="radio" value="right">
                <i class="form-icon"></i> Right
              </label>
              <label class="form-switch">
                <input class="form-switch" data-variable="options.scales.y2.reverse" type="checkbox">
                <i class="form-icon"></i>Reverse Y2-Axis
              </label>
            </label>
          </div>
        </details>

        <!-- CHART TITLE OPTIONS -->
        <details open>
          <summary>Chart Title</summary>
          <div class="form-group">
            <label class="form-switch">
              <input class="form-switch" data-variable="options.plugins.title.display" type="checkbox">
              <icon class="form-icon"></icon>
              Display Title
            </label>
            <input class="form-input" data-variable="options.plugins.title.text" placeholder="Input your title here..."
              value=""></input>
            <select class="form-select" data-variable="options.plugins.title.align">
              <option value="center">Title Alignment - Centered</options>
              <option value="start">Title Alignment - Start</options>
              <option value="end">Title Alignment - End</options>
            </select>
            <select class="form-select" data-variable="options.plugins.title.position">
              <option value="top">Title Position - Top</options>
              <option value="left">Title Position - Left</options>
              <option value="right">Title Position - Right</options>
              <option value="bottom">Title Position - Bottom</options>
            </select>
          </div>
        </details>

        <details>
          <summary>Chart Legend</summary>
          <div class="form-group">
            <label class="form-switch">
              <input class="form-switch" data-variable="options.plugins.legend.display" type="checkbox" checked>
              <icon class="form-icon"></icon>
              Display Legend
            </label>
            <select class="form-select" data-variable="options.plugins.legend.align">
              <option value="center">Legend Alignment - Centered</options>
              <option value="start">Legend Alignment - Start</options>
              <option value="end">Legend Alignment - End</options>
            </select>
            <select class="form-select" data-variable="options.plugins.legend.position">
              <option value="top">Legend Position - Top</options>
              <option value="left">Legend Position - Left</options>
              <option value="right">Legend Position - Right</options>
              <option value="bottom">Legend Position - Bottom</options>
            </select>
          </div>
        </details>

        <!-- CHART SUBTITLE -->
        <details>
          <summary>Chart Subtitle</summary>
          <div class="form-group">
            <label class="form-switch">
              <input class="form-switch" data-variable="options.plugins.subtitle.display" type="checkbox">
              <icon class="form-icon"></icon>
              Display Subtitle
            </label>
            <input class="form-input" data-variable="options.plugins.subtitle.text"
              placeholder="Input your subtitle here..." value=""></input>
            <select class="form-select" data-variable="options.plugins.subtitle.align">
              <option value="center">Subtitle Alignment - Centered</options>
              <option value="start">Subtitle Alignment - Start</options>
              <option value="end">Subtitle Alignment - End</options>
            </select>
            <select class="form-select" data-variable="options.plugins.subtitle.position">
              <option value="bottom">Subtitle Position - Bottom</options>
              <option value="top">Subtitle Position - Top</options>
              <option value="left">Subtitle Position - Left</options>
              <option value="right">Subtitle Position - Right</options>
            </select>
          </div>
        </details>
      </div>
      </details>

      <!-- DATASETS -->
      <div class="form-group">
        <h4>Datasets</h4>
        <button id="button-insert-dataset" onclick="() => insertDataset()">Insert Dataset</button>
        <details id="dataset-container">
          <summary>Dataset #1</summary>
        </details>
      </div>
      </div>
    </section>

    <section id="section-visual-chart">
      <figure id="chart-figure">
        <h4>Chart</h4>
        <canvas id="chart"></canvas>
      </figure>
      <textarea id="chart-code" rows="10">
      </textarea>
    </section>

    <section id="options">
    </section>

  </main>
  <footer>
    <div class="divider"></div>
    <p>Updated 2026.01.19<br>
      Created with ❤️ by A. Dean Kelly</p>
    <p>Random data provided by Faker.js</p>
  </footer>

  <script src="chart-generator.js"></script>
</body>

</html>
